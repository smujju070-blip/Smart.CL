<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Smart.CL">
<title>Smart.CL</title>
<style>
:root{--bg:#f6f6f4;--card:#fff;--text:#1c1c1a;--muted:#77776f;--line:#dcdcd5;--accent:#2f6f4f;--accent-bg:#e4f1ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#212120;--text:#ececE8;--muted:#9a9a92;--line:#3a3a37;--accent:#7fd1a4;--accent-bg:#1f3329}}
:root[data-theme="dark"]{--bg:#161615;--card:#212120;--text:#ececE8;--muted:#9a9a92;--line:#3a3a37;--accent:#7fd1a4;--accent-bg:#1f3329}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 12px}
.rules{display:flex;gap:10px;margin-bottom:12px}
.rules label{flex:1;font-size:12px;color:var(--muted)}
.rules input{display:block;width:100%;margin-top:4px;padding:10px;font-size:var(--fs,16px);border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.col h2{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
textarea{width:100%;height:var(--th,120px);min-height:60px;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:var(--fs,16px)/1.6 ui-monospace,Menlo,Consolas,monospace}
.out{height:var(--oh,260px);min-height:80px;overflow:auto}
.row{display:grid;grid-template-columns:2.2em repeat(var(--n,3),1fr);gap:6px;font:var(--fs,16px)/1.6 ui-monospace,Menlo,Consolas,monospace;border-bottom:1px dashed var(--line)}
.row span:first-child{color:var(--cn,var(--muted))}
.row b{font-weight:700}
.row b.ch{color:var(--ch)}
.row b.cw{color:var(--cw)}
.row b.cd{color:var(--cd)}
.row.bad b{color:#c0392b}
.grid .col:nth-child(2){order:-1}
.rules label:nth-child(2),.rules label:nth-child(3),.rules label:nth-child(4){order:-1}
.cp{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.cp .lbl{width:58px;font-size:12px;color:var(--muted)}
.cp .sw{width:26px;height:26px;border-radius:50%;border:3px solid var(--card);outline:2px solid transparent;padding:0;margin:0}
.cp .sw.on{outline-color:var(--text)}
.cp .ci{width:32px;height:28px;padding:0;border:0;background:none}
#colors{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:50;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#colors.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.top h1{margin:0}
#mbtn{margin:0;padding:6px 14px;font-size:24px;line-height:1;background:transparent;color:var(--text)}
#menu{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:70;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:4px}
#menu.hide{display:none}
#menu button{margin:0;text-align:left;padding:12px 16px;background:transparent;color:var(--text);font-size:15px;white-space:nowrap}
#colors:empty{display:none}
.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;align-items:center}
.chips .chip{margin:0;padding:6px 12px;font-size:13px}
.chips .chip.off{background:transparent;color:var(--muted);text-decoration:line-through}
.rules .op{margin:0 0 0 2px;padding:4px 8px;font-size:12px;vertical-align:middle}
#units{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:50;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#units.hide{display:none}
.uc{margin-bottom:10px}
.uc .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.uc .ur{display:flex;gap:6px;flex-wrap:wrap}
.uc .ub{margin:0;padding:8px 14px;font-size:14px;background:transparent;color:var(--text)}
.uc .ub.on{background:var(--accent);color:var(--bg)}
#opmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:60;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 1fr;gap:8px}
#opmenu.hide{display:none}
#opmenu .lbl{grid-column:1/-1;font-size:12px;color:var(--muted)}
#opmenu .ob{margin:0;padding:14px;font-size:18px;background:transparent;color:var(--text)}
#opmenu .ob.on{background:var(--accent);color:var(--bg)}
#pull{height:28px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize;margin-top:4px}
#pull span{width:70px;height:7px;border-radius:4px;background:var(--muted);opacity:.6}
#thmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:60;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:70vh;overflow:auto}
#thmenu.hide{display:none}
#thmenu .lbl{grid-column:1/-1;font-size:12px;color:var(--muted)}
#thmenu .tc{margin:0;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;background:transparent;color:var(--text);font-size:13px;border:2px solid var(--line);border-radius:12px}
#thmenu .tc.on{border-color:var(--accent)}
#thmenu .pv{height:46px;border-radius:8px;display:flex;align-items:flex-end;gap:6px;padding:6px;border:1px solid var(--line)}
#thmenu .pv i{display:block;height:14px;flex:1;border-radius:4px}
.done{display:block;margin:0 0 10px auto;padding:7px 16px;font-size:13px;background:var(--accent);color:var(--bg)}
#thmenu .done{grid-column:1/-1;margin:0 0 4px auto}
#hmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:60;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:70vh;overflow:auto}
#hmenu.hide{display:none}
#hmenu .lbl{font-size:12px;color:var(--muted)}
.hact{display:flex;gap:8px;margin-bottom:10px}
.hact button{flex:1;margin:0;padding:10px;font-size:14px}
.hrow{display:flex;gap:6px;margin-bottom:6px}
.hrow .hr1{flex:1;margin:0;text-align:left;padding:10px 12px;font-size:13px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;font-weight:500}
.hrow .hx{margin:0;padding:0 14px;font-size:14px;background:transparent;color:var(--muted)}
#pull2{height:28px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ns-resize;margin-top:4px}
#pull2 span{width:70px;height:7px;border-radius:4px;background:var(--muted);opacity:.6}
.row.hd{position:sticky;top:0;background:var(--card);font:600 12px/1.8 system-ui,-apple-system,sans-serif;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);z-index:1}
.row.hd span{color:var(--muted)}
.rtitle{width:100%;padding:10px 12px;margin-bottom:8px;font-size:20px;font-weight:800;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
.rules label.off{display:none}
.rules label#lt2{color:var(--c2,#f59e0b);font-weight:700}
.rules label#lt2 input{border:2px solid var(--c2,#f59e0b);background:color-mix(in srgb,var(--c2,#f59e0b) 14%,var(--card))}
.rules label#lt2 .op{border-color:var(--c2,#f59e0b)}
.chips .chip[data-k="c2"]:not(.off){background:color-mix(in srgb,var(--c2,#f59e0b) 22%,var(--card));border:2px solid var(--c2,#f59e0b);font-weight:700}
.row b.c2{color:var(--c2)}
#nmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:60;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#nmenu.hide{display:none}
#nmenu .nr{margin-bottom:10px}
#nmenu .nr label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
#nmenu .ni{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text)}
#nmenu .reset{margin:0;padding:8px 14px;font-size:13px;background:transparent;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.enter{width:100%;margin:0 0 10px;padding:14px;font-size:16px;background:var(--accent);color:var(--bg)}
button{margin-top:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:600}

/* solid switch buttons (inside SWidth source panel) */
#td,#t2{background:#2e3943;color:#f1efeb;border:1px solid #1b2228;border-radius:6px;font-weight:700;letter-spacing:.03em;box-shadow:0 3px 0 #11171b;transition:transform .05s,box-shadow .05s;display:block;width:100%;min-height:46px;padding:10px 8px;font-size:15px;text-align:center;white-space:nowrap}
#td:active,#t2:active{transform:translateY(3px);box-shadow:none}
#smenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:60;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#smenu.hide{display:none}
#smenu .sl{font-size:12px;color:var(--muted);margin-top:6px}
#smenu #td,#smenu #t2{margin:6px 0 10px}
#menu #ac{background:#d62828;color:#fff;font-weight:800;text-align:center;border-radius:8px;margin-top:4px}
#menu #ac:active{background:#b81f1f}

#pmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:75;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35);max-height:75vh;overflow:auto}
#pmenu.hide{display:none}
#pmenu .lbl{font-size:12px;color:var(--muted);margin:4px 0 6px}
#pmenu .pn{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);margin-bottom:6px}
#pmenu .psave{width:100%;margin:0 0 10px;padding:12px;font-size:14px}
#pmenu .prow{display:flex;gap:6px;margin-bottom:6px}
#pmenu .p1{flex:1;margin:0;text-align:left;padding:10px 12px;font-size:13px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:10px;font-weight:500}
#pmenu .p1 b{display:block;font-size:15px}
#pmenu .p1 span{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace}
#pmenu .px{margin:0;padding:0 14px;font-size:14px;background:transparent;color:var(--muted)}

#cfm{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#cfm.hide{display:none}
#cfm .bx{width:100%;max-width:340px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#cfm .t{font-size:16px;font-weight:700;margin-bottom:4px}
#cfm .m{font-size:13px;color:var(--muted);margin-bottom:14px;word-break:break-word}
#cfm .r{display:flex;gap:8px}
#cfm .r button{flex:1;margin:0;padding:12px;font-size:15px}
#cfm .no{background:transparent;color:var(--text)}
#cfm .yes{background:#d62828;color:#fff;border-color:#d62828}

#tsmenu{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 90px);z-index:75;max-width:420px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#tsmenu.hide{display:none}
#tsmenu .lbl{font-size:12px;color:var(--muted);margin-bottom:8px}
#tsmenu .sr{display:flex;align-items:center;gap:10px}
#tsmenu .sr input{flex:1;margin:0;height:36px;accent-color:var(--accent)}
#tsmenu .sr span{font-size:12px;color:var(--muted)}
#tsmenu .sr span.big{font-size:22px}
#tsmenu .pvw{margin:12px 0;padding:10px;border:1px dashed var(--line);border-radius:10px;font:var(--fs,16px)/1.6 ui-monospace,Menlo,Consolas,monospace}
#tsmenu .reset{margin:0;padding:8px 14px;font-size:13px;background:transparent;color:var(--muted)}

.brand{display:flex;align-items:center;gap:10px;font-size:24px;line-height:1}
.brand .lg{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:var(--bg);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--text)));box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.brand .nm{font-weight:800;letter-spacing:-.03em;color:var(--text)}
.brand .nm em{font-style:normal;font-weight:700;letter-spacing:0;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--text)));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.credit{text-align:right;font-size:12px;color:var(--muted);margin:14px 0 4px}
.brand .lg7{flex:none;display:block;filter:drop-shadow(0 3px 8px color-mix(in srgb,var(--accent) 35%,transparent))}
.lg7 .la{fill:var(--accent)}.lg7 .lb{fill:color-mix(in srgb,var(--accent) 45%,#101010)}.lg7 .lt{stroke:var(--accent)}.lg7 .lm{fill:var(--bg)}

#wire{position:relative;height:236px;margin:10px 0 6px;touch-action:none;user-select:none;-webkit-user-select:none}
#wire svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#wire .wn{position:absolute;width:38%;height:54px;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;align-items:center;padding:0 12px;font-size:13px;font-weight:700;line-height:1.2}
#wire .wl{left:0}#wire .wr{right:0;padding-left:24px}#wire .wl{padding-right:24px}
#wire .wp{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;border:3px solid var(--accent);background:var(--card);touch-action:none;cursor:pointer;z-index:2}
#wire .wl .wp{right:-15px}#wire .wr .wp{left:-15px}
#wire .wp.on{background:var(--accent)}
#wire .wp.sel{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent)}
#wire .wp.no{opacity:.25}
#wire path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round}
#wire path.tmp{stroke-dasharray:2 8;opacity:.8}
#smenu .reset{margin:0;padding:8px 14px;font-size:13px;background:transparent;color:var(--muted)}
#wel{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#wel.hide{display:none}
#wel .bx{width:100%;max-width:340px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px 18px 18px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
#wel .ic{font-size:36px;line-height:1;margin-bottom:8px}
#wel .t{font-size:18px;font-weight:800;margin-bottom:8px}
#wel .m{font-size:15px;line-height:1.5;color:var(--muted);margin-bottom:16px}
#wel button{width:100%;margin:0;padding:13px;font-size:16px;background:var(--accent);color:var(--bg)}
#tour{position:fixed;inset:0;z-index:300}
#tour.hide{display:none}
#tsp{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,.68);outline:3px solid var(--accent);pointer-events:none;transition:all .25s}
#tcard{position:fixed;left:16px;right:16px;max-width:360px;margin:0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#tcard .tn{font-size:12px;color:var(--muted);margin-bottom:4px}
#tcard .tt{font-size:17px;font-weight:800;margin-bottom:6px}
#tcard .tm{font-size:14px;line-height:1.5;margin-bottom:12px}
#tcard .tr{display:flex;gap:8px;align-items:center}
#tcard .tr button{margin:0;padding:10px 14px;font-size:14px}
#tcard .tskip{background:transparent;color:var(--muted);margin-right:auto!important}
#tcard .tnext{background:var(--accent);color:var(--bg)}
#wel .skip{margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="top"><h1 class="brand"><svg class="lg7" width="36" height="36" viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="lc"><rect width="100" height="100" rx="24"/></clipPath></defs><g clip-path="url(#lc)"><rect class="la" width="100" height="100"/><rect class="lb" y="70" width="100" height="30"/><path d="M10 70v10M20 70v6M30 70v10M40 70v6M50 70v10M60 70v6M70 70v10M80 70v6M90 70v10" class="lt" stroke-width="3" fill="none"/><text x="50" y="58" font-size="46" font-weight="900" text-anchor="middle" class="lm" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">S</text></g></svg><span class="nm">Smart<em>.CL</em></span></h1><button id="mbtn" aria-label="Menu">☰</button></div>
<div class="rules">
  <label>SHight <button class="op" id="oh" type="button"></button><input id="dh" type="number" inputmode="decimal"></label>
  <label>Width <button class="op" id="ow" type="button"></button><input id="dw" type="number" inputmode="decimal"></label>
  <label>SWidth <button class="op" id="od" type="button"></button><input id="dd" type="number" inputmode="decimal"></label>
  <label id="lt2" class="off">For Net <button class="op" id="o2" type="button"></button><input id="d2" type="number" inputmode="decimal"></label>
</div>
<div id="menu" class="hide"><button id="fbtn">🔠 Text size</button><button id="nbtn">✏️ Rename</button><button id="pbtn">💾 Presets</button><button id="hbtn">🕘 History</button><button id="sbtn">🔗 SWidth source</button><button id="ubtn">📏 Units</button><button id="cbtn">🎨 Colors</button><button id="tbtn">🎭 Theme</button><button id="tutbtn">🎓 Tutorial</button><button id="ac">AC</button></div>
<div id="units" class="hide"><button class="done" data-c="units">Done</button></div>
<div id="smenu" class="hide"><button class="done" data-c="smenu">Done</button>
  <div class="sl">Tap a dot, then tap another dot (or drag between them) to connect. SWidth and For Net use the number from the line plugged into them.</div>
  <div id="wire"></div>
  <button class="reset" id="wreset" type="button">Reset connections</button>
  <div style="display:none"><button id="td" type="button"></button><button id="t2" type="button"></button></div></div>
<div id="colors" class="hide"><button class="done" data-c="colors">Done</button></div>
<button class="enter" id="enter">ENTER ↵</button>
<div class="grid">
  <div class="col"><h2 id="th">Hights</h2><textarea id="h" inputmode="decimal"></textarea></div>
  <div class="col"><h2 id="tw">Widths</h2><textarea id="w" inputmode="decimal"></textarea></div>
</div>
<div id="pull" title="Drag up or down"><span></span></div>
<div class="col" style="margin-top:10px">
  <input id="rtitle" class="rtitle" type="text" placeholder="Type title..." autocomplete="off">
  <div class="chips"><button class="chip" data-k="cw">Width</button><button class="chip" data-k="cd">SWidth</button><button class="chip off" data-k="c2">For Net</button><button class="chip" data-k="ch">SHight</button></div>
  <div class="out" id="out"></div>

(function(){
  const W=$('wire');

  W.innerHTML='<svg></svg>'+L.map(([id,t])=>'<div class="wn wl" style="top:'+t+'px"><span class="wt" data-o="'+id+'"></span><i class="wp" data-side="o" data-id="'+id+'"></i></div>').join('')+R.map(([id,t])=>'<div class="wn wr" style="top:'+t+'px"><span class="wt" data-i="'+id+'"></span><i class="wp" data-side="i" data-id="'+id+'"></i></div>').join('');
  const svg=W.querySelector('svg');
  const ACC={d:['raw','w'],e:['raw','w','d']};
  const ok=(i,o)=>ACC[i].includes(o);
  let pend=null,drag=null;
  const port=(side,id)=>W.querySelector('.wp[data-side="'+side+'"][data-id="'+id+'"]');
  const ctr=el=>{const r=el.getBoundingClientRect(),b=W.getBoundingClientRect();return[r.left+r.width/2-b.left,r.top+r.height/2-b.top]};
  const curve=(a,b)=>{const dx=Math.max(30,Math.abs(b[0]-a[0])/2);return'M'+a[0]+' '+a[1]+' C'+(a[0]+dx)+' '+a[1]+' '+(b[0]-dx)+' '+b[1]+' '+b[0]+' '+b[1]};
  function render(){
    W.querySelectorAll('[data-o]').forEach(x=>{const k=x.dataset.o;x.textContent=k==='raw'?'Typed '+OPN.w:k==='w'?OPN.w+' (result)':OPN.d+' (result)'});
    W.querySelectorAll('[data-i]').forEach(x=>{x.textContent=OPN[x.dataset.i]});
    const act=pend||drag;
    W.querySelectorAll('.wp').forEach(p=>{
      const s=p.dataset.side,id=p.dataset.id;
      p.classList.toggle('on',s==='o'?(src.d===id||src.e===id):true);
      p.classList.toggle('sel',!!act&&act.side===s&&act.id===id);
      let no=false;if(act&&act.side!==s)no=!(s==='i'?ok(id,act.id):ok(act.id,id));
      if(act&&act.side===s&&!(act.side===s&&act.id===id))no=true;
      p.classList.toggle('no',no);
    });
    let h='';
    ['d','e'].forEach(k=>{h+='<path d="'+curve(ctr(port('o',src[k])),ctr(port('i',k)))+'"/>'});
    if(drag&&drag.moved){const b=W.getBoundingClientRect(),p0=ctr(port(drag.side,drag.id)),p1=[drag.x-b.left,drag.y-b.top];h+='<path class="tmp" d="'+(drag.side==='o'?curve(p0,p1):curve(p1,p0))+'"/>'}
    svg.innerHTML=h;
  }
  function connect(a,b){const o=a.side==='o'?a:b,i=a.side==='o'?b:a;if(o.side===i.side||!ok(i.id,o.id))return false;src[i.id]=o.id;calc();return true}
  W.addEventListener('pointerdown',e=>{
    const p=e.target.closest('.wp');if(!p)return;e.preventDefault();
    const d={side:p.dataset.side,id:p.dataset.id,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,moved:false,el:p};
    if(pend&&pend.side!==d.side){connect(pend,d);pend=null;render();return}
    drag=d;try{W.setPointerCapture(e.pointerId)}catch(_){}render();
  });
  W.addEventListener('pointermove',e=>{if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;if(Math.hypot(drag.x-drag.x0,drag.y-drag.y0)>8)drag.moved=true;render()});
  const end=e=>{
    if(!drag)return;const d=drag;drag=null;
    const t=document.elementFromPoint(e.clientX,e.clientY),q=t&&t.closest&&t.closest('.wp');
    if(d.moved){pend=null;if(q&&q!==d.el)connect(d,{side:q.dataset.side,id:q.dataset.id})}

  };

})();
